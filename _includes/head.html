<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  {%- if page.url contains 'poems' -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Kalam:wght@300;400;700&family=Klee+One&display=swap" rel="stylesheet">
  <style>
    .poem-page {
      max-width: 560px;
      margin: 2rem auto;
    }

    /* Section label — bigger, handwritten feel */
    .poem-section-label {
      font-family: 'Kalam', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      color: #5a3e28;
      border-bottom: 2px solid #d4b896;
      padding-bottom: 0.3rem;
      margin-bottom: 2.5rem;
      display: block;
    }

    .poem-section-divider {
      border: none;
      border-top: 1px dashed #d8cfc0;
      margin: 4.5rem 0;
    }

    /* Raw paper noise overlay via ::before */
    .poem-card::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      background-image: url('/assets/nepali-kagaj.svg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      opacity: 0.85;
      mix-blend-mode: multiply;
    }

    /* Lift all card content above the texture layer */
    .poem-card > * {
      position: relative;
      z-index: 1;
    }

    /* Nepali kagaj — warm lokta golden, no lines */
    .poem-card {
      position: relative;
      background-color: rgba(204, 180, 124, 0.45);
      background-image:
        repeating-linear-gradient(17deg,  transparent 0, transparent 11px, rgba(120,80,20,0.022) 11px, rgba(120,80,20,0.022) 12px),
        repeating-linear-gradient(53deg,  transparent 0, transparent 7px,  rgba(140,95,30,0.018) 7px,  rgba(140,95,30,0.018) 8px),
        repeating-linear-gradient(97deg,  transparent 0, transparent 14px, rgba(110,75,15,0.015) 14px, rgba(110,75,15,0.015) 15px),
        repeating-linear-gradient(134deg, transparent 0, transparent 9px,  rgba(135,90,25,0.016) 9px,  rgba(135,90,25,0.016) 10px),
        repeating-linear-gradient(161deg, transparent 0, transparent 5px,  rgba(125,85,18,0.012) 5px,  rgba(125,85,18,0.012) 6px),
        repeating-linear-gradient(207deg, transparent 0, transparent 18px, rgba(115,78,20,0.016) 18px, rgba(115,78,20,0.016) 19px);
      border: none;
      border-radius: 1px;
      box-shadow: 4px 6px 16px rgba(0,0,0,0.09);
      padding: 2rem 3rem 1.8rem 3rem;
      margin-bottom: 5rem;
      font-family: 'Kalam', cursive;
    }

    /* Title — distinct, separated by a rule */
    .poem-card .poem-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #3a2410;
      font-family: 'Kalam', cursive;
      line-height: 1.7;
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
    }

    /* Body — natural line height, no ruled alignment needed */
    .poem-card .poem-body {
      font-size: 1.05rem;
      line-height: 1.85;
      color: #3a2e20;
    }

    /* Stanza break: blank line = <p> — full gap between stanzas */
    .poem-card .poem-body p {
      margin-bottom: 1.4em;
    }

    .poem-card .poem-body p:last-child {
      margin-bottom: 0;
    }

    /* Meta — date/place as a stamp, separated from body */
    .poem-card .poem-meta {
      margin-top: 1.4rem;
      padding-top: 0.7rem;
      border-top: 1px solid #ddd0b8;
      font-size: 0.72rem;
      color: #9a7040;
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-style: italic;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Author signature */
    .poem-signature {
      margin-top: 1.2rem;
      text-align: right;
      line-height: 1;
    }

    .lang-en .poem-signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.15rem;
      color: rgba(90, 62, 40, 0.72);
      padding-bottom: 4px;
    }

    .lang-ne .poem-signature {
      font-family: 'Kalam', cursive;
      font-style: italic;
      font-size: 0.95rem;
      color: rgba(90, 62, 40, 0.72);
      padding-bottom: 4px;
    }

    .lang-en .poem-signature::after,
    .lang-ne .poem-signature::after {
      content: '';
      display: block;
      height: 5px;
      margin-top: 3px;
      background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='5'><path d='M1 3.2 Q14 1.2 29 3.8 Q44 5.8 59 2.8 Q70 1 79 3.4' stroke='%235a3e28' stroke-width='1.2' fill='none' stroke-linecap='round' opacity='0.60'/></svg>");
      background-position: right center;
      background-repeat: no-repeat;
      background-size: auto 100%;
    }

    .lang-ja .poem-signature {
      display: flex;
      justify-content: flex-end;
    }

    .poem-signature .hanko {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.9rem;
      height: 3.8rem;
      border: 1.5px solid #b91c1c;
      border-radius: 4px;
      color: #b91c1c;
      font-family: 'Klee One', serif;
      font-size: 0.58rem;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.1em;
      opacity: 0.80;
    }

    /* TOC — subtle collapsible index */
    details.poem-toc {
      margin-bottom: 3rem;
      border-bottom: 1px dashed #e0d0b0;
      padding-bottom: 0.5rem;
    }

    details.poem-toc summary {
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #b0956e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      list-style: none;
      padding: 0.4rem 0;
      user-select: none;
    }

    details.poem-toc summary::-webkit-details-marker { display: none; }
    details.poem-toc summary::before { content: '▸  '; font-size: 0.65rem; }
    details.poem-toc[open] summary::before { content: '▾  '; }

    details.poem-toc ul {
      margin: 1rem 0 0.5rem 0.5rem;
      list-style: none;
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      color: #7a5a3a;
      line-height: 2.2;
    }

    details.poem-toc ul li a {
      color: #7a5a3a;
      text-decoration: none;
    }

    details.poem-toc ul li a:hover {
      color: #3a2410;
      text-decoration: underline;
    }

    details.poem-toc ul li::before {
      content: '— ';
      color: #c8a870;
    }

    details.poem-toc .toc-group-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #bba080;
      margin-top: 0.8rem;
      display: block;
    }

    /* Type sub-label within a language section */
    .poem-type-sublabel {
      font-family: 'Kalam', cursive;
      font-size: 1.2rem;
      font-weight: 400;
      color: #8a6040;
      margin: 0 0 2rem 0;
      display: block;
      border-bottom: 1px dashed #e0d0b0;
      padding-bottom: 0.3rem;
    }

    /* TOC type sub-label (Poems / Free Writing inside a language group) */
    details.poem-toc .toc-type-label {
      font-family: 'Kalam', cursive;
      font-size: 0.88rem;
      color: #8a6040;
      margin-top: 0.5rem;
      margin-left: 0.2rem;
      display: block;
    }

    /* Language badge — subtle top-right corner */
    .poem-card[data-lang]:not([data-lang="en"])::after {
      content: attr(data-lang);
      position: absolute;
      top: 0.6rem;
      right: 0.9rem;
      font-size: 0.58rem;
      color: #c8a870;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 0.8;
    }

    /* Japanese — Klee One handwritten font */
    .poem-card.lang-ja .poem-body,
    .poem-card.lang-ja .poem-title {
      font-family: 'Klee One', cursive;
    }

    /* Nepali — Kalam supports Devanagari */
    .poem-card.lang-ne .poem-body,
    .poem-card.lang-ne .poem-title {
      font-family: 'Kalam', cursive;
    }

    /* About note at page bottom */
    .poem-page-about {
      margin-top: 4rem;
      padding-top: 1.4rem;
      border-top: 1px dashed #d8c8a8;
    }

    .poem-page-about p {
      font-family: 'Kalam', cursive;
      font-size: 0.92rem;
      color: #a08060;
      line-height: 1.9;
      text-align: center;
      margin: 0;
    }

    .about-sep {
      border: none;
      width: 3rem;
      border-top: 1px dashed #c8a870;
      margin: 0.9rem auto;
      opacity: 0.7;
    }

    @media screen and (max-width: 600px) {
      .poem-card {
        padding: 1.8rem 1.5rem 1.5rem 1.5rem;
      }
    }
  </style>
  {%- endif -%}
</head>
