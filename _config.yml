theme: minima

title: ashok314
author: Ashok Acharya
lang: en
ui_lang: ja
supported_ui_langs: [ja, en, ne, hi, kn]
description: >-
  Software Engineer & Researcher. Programming Languages, Software Verification,
  Separation Logic. Based in Tokyo.

url: "https://ashok314.github.io"
baseurl: ""
repository: Ashok314/ashok314.github.io
google_analytics: "G-9X7E2PB8WH"

minima:
  skin: classic

header_pages:
  - index.md
  - books.md
  - films.md
  - poems.md
  - tech.md
  - cooking.md
  - tools.md

social_links:
  - { platform: github, user_url: "https://github.com/Ashok314" }
  - { platform: linkedin, user_url: "https://www.linkedin.com/in/ashok314/" }

exclude:
  - DEV.md
  - .agents/AGENTS.md
  - .agents/TODO.md
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-feed

collections:
  cooking:
    output: true
    permalink: /cooking/:name/
  tech:
    output: true
    permalink: /tech/:name/
  poems:
    output: false

defaults:
  - scope:
      path: ""
      type: cooking
    values:
      layout: recipe
  - scope:
      path: ""
      type: tech
    values:
      layout: article
